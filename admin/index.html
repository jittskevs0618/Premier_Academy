<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Premier Academy — Content Editor</title>
<style>
  /* Shown for the instant before Decap's own UI takes over the page.
     Decap does not replace this element when it mounts — it appends its
     own UI as new content elsewhere in <body>, so without `position: fixed`
     and explicit removal below, this placeholder just sits on top and
     pushes the real login screen out of view, off the bottom of the page. */
  body { margin: 0; font: 15px system-ui, sans-serif; background: #f8f9f8; color: #4a4a58; }
  .loading { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #f8f9f8; }
</style>
</head>
<body>
<div class="loading" id="initial-loading">Loading the editor…</div>

<!-- Load our own JS config (admin/config.js) instead of the config.yml Decap
     looks for automatically, so base_url can be window.location.origin —
     see the comment at the top of config.js for why. -->
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="config.js"></script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  // Decap appends its real UI as a new element in <body> instead of
  // replacing the placeholder above, so remove the placeholder ourselves
  // the moment anything new shows up alongside it. This has to be set up
  // BEFORE calling CMS.init() below — React's initial render can happen
  // synchronously within that call, so watching for the mutation is only
  // reliable if the observer is already attached first.
  (function () {
    var loadingEl = document.getElementById('initial-loading');
    var done = false;
    var fallback;
    function reveal() {
      if (done) return;
      done = true;
      observer.disconnect();
      clearTimeout(fallback);
      if (loadingEl && loadingEl.parentNode) loadingEl.remove();
    }
    var observer = new MutationObserver(reveal);
    observer.observe(document.body, { childList: true });
    // Safety net: if Decap never adds anything (an unexpected failure mode),
    // don't leave editors staring at "Loading the editor..." forever.
    fallback = setTimeout(reveal, 8000);
  })();

  CMS.init({ config: window.CMS_CONFIG });
</script>
</body>
</html>
