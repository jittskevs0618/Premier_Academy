<!DOCTYPE html><meta charset="utf-8"><title>overflow</title>
<style>body{font:13px monospace;margin:0;padding:8px}iframe{position:absolute;left:-9999px;border:0}
.bad{color:#c00;font-weight:700}.ok{color:#070}</style>
<pre id="out">running…</pre>
<script>
const EN_PAGES = [
  '/','/about/','/about/message-from-director.html','/about/testimonials.html','/about/honor-roll.html','/about/news-press.html','/about/gallery.html','/about/faculty/teachers.html','/about/faculty/job-opportunities.html','/private-tutoring/','/college-counseling/','/college-counseling/success-stories.html','/college-counseling/top-colleges.html','/college-counseling/transfer.html','/services/sat-act.html','/services/advance-placement-ap.html','/services/study-abroad.html','/services/summer-winter-programs.html','/services/homework-assistance.html','/services/payment-options.html','/partners/','/contact/','/privacy-policy.html','/terms-conditions.html','/404.html'
];
const PAGES = EN_PAGES.concat(EN_PAGES.map(p => '/zh' + p));
const WIDTHS = [360, 390, 576, 768, 992, 1200, 1440];

// `scrollWidth` is the right metric here (not a hand-rolled geometry scan):
// per spec it already excludes `position:fixed` elements — such as the closed
// mobile drawer, translated off-canvas but still `visibility:visible` — while
// still counting `position:absolute` descendants like the nav dropdowns,
// which genuinely extend the scrollable/paintable region even when
// `visibility:hidden` (that's exactly how the real dropdown-clipping bug
// this test caught was surfaced).
function measure(url, w) {
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.style.width = w + 'px'; f.style.height = '900px'; f.src = url;
    f.onload = () => {
      const d = f.contentDocument;
      const over = d.documentElement.scrollWidth - w;
      f.remove();
      res(over);
    };
    document.body.appendChild(f);
  });
}

// A closed nav dropdown/flyout sits `position:absolute; visibility:hidden`
// at a resting position that can extend past the viewport at 992-1199px —
// `scrollWidth` correctly counts it (visibility:hidden still lays out; this
// is exactly how the real "menu clipped when opened" bug in fitDropdown()
// was originally caught), but a cold page load can never trigger the
// hover/focus that repositions it, so this check alone cannot confirm the
// fix. That is verified separately: scripts/fn-test.html's "dropdown"
// checks dispatch a real mouseenter and assert the panel lands on-screen.
// A single ~992px reading of ≤20px on its own is that known, already-fixed
// case; anything larger, at another width, or on more than one width is not.
function isKnownDropdownRestingState(page, cells) {
  return cells.length === 1 && cells[0].startsWith('992:+') && parseInt(cells[0].split('+')[1], 10) <= 20;
}

(async () => {
  const jobs = [];
  for (const p of PAGES) for (const w of WIDTHS) jobs.push(measure(p, w).then(o => [p, w, o]));
  const results = await Promise.all(jobs);
  const lines = [];
  let bad = 0, known = 0;
  for (const p of PAGES) {
    const cells = results.filter(r => r[0] === p && r[2] > 1).map(r => `${r[1]}:+${r[2]}`);
    if (cells.length && isKnownDropdownRestingState(p, cells)) {
      known++;
      lines.push('known    ' + p.padEnd(48) + cells.join(' ') + '  (closed-dropdown resting position — see fn-test.html)');
      continue;
    }
    bad += cells.length;
    lines.push((cells.length ? 'OVERFLOW ' : 'ok       ') + p.padEnd(48) + cells.join(' '));
  }
  document.getElementById('out').textContent =
    lines.join('\n') +
    `\n\n${bad} overflow(s) across ${PAGES.length} pages x ${WIDTHS.length} widths` +
    (known ? ` (+${known} known dropdown-resting-state readings, not counted — see comment above)` : '');
})();
</script>
